name: Manual Legacy Blog Publisher

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-qualified-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run quality-gated publisher
        run: node scripts/publish-daily.mjs

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain src/content/)" ]; then
            git add src/content/
            git commit -m "chore(blog): publish qualified post [skip ci]"
            if git push origin HEAD:main 2>push_err.txt; then
              echo "Successfully committed and pushed qualified blog article."
            else
              ERR=$(tr '\n' ' ' < push_err.txt | cut -c1-500)
              echo "Push failed: $ERR"
              gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
                -f body="techvrs auto-publish: git push FAILED - $ERR" >/dev/null 2>&1 || true
              exit 1
            fi
          else
            echo "No qualified article was published."
          fi
