<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Widget</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      /* When loaded standalone (not in iframe) show a demo backdrop */
    }

    /* ── Floating bubble ────────────────────────────────────────────────── */
    #chat-bubble {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 9999;
      border: none;
      outline: none;
    }
    #chat-bubble:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 26px rgba(37, 99, 235, 0.55);
    }
    #chat-bubble svg { transition: opacity 0.2s; }
    #chat-bubble .icon-close { display: none; }
    #chat-bubble.open .icon-chat { display: none; }
    #chat-bubble.open .icon-close { display: block; }

    /* Notification dot */
    #notif-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      border: 2px solid white;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.75; }
    }

    /* ── Chat window ────────────────────────────────────────────────────── */
    #chat-window {
      position: fixed;
      bottom: 92px;
      right: 24px;
      width: 360px;
      max-height: 520px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 9998;
      transform: scale(0.92) translateY(12px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), opacity 0.18s ease;
    }
    #chat-window.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    /* Header */
    #chat-header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      padding: 14px 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-info h3 { font-size: 14px; font-weight: 600; }
    .header-info p  { font-size: 11px; opacity: 0.85; margin-top: 1px; }
    .online-dot {
      width: 8px; height: 8px; background: #4ade80;
      border-radius: 50%; display: inline-block; margin-right: 4px;
    }

    /* Messages */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar { width: 4px; }
    #chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .msg {
      max-width: 82%;
      line-height: 1.45;
      font-size: 13.5px;
      animation: fadeUp 0.18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.bot {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111827;
      padding: 9px 13px;
      border-radius: 4px 16px 16px 16px;
    }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 9px 13px;
      border-radius: 16px 16px 4px 16px;
    }

    /* Typing indicator */
    .typing-indicator {
      align-self: flex-start;
      background: #f3f4f6;
      border-radius: 4px 16px 16px 16px;
      padding: 10px 14px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.18s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* Input area */
    #chat-input-area {
      border-top: 1px solid #f0f0f0;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
      background: #fff;
    }
    #chat-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 13.5px;
      outline: none;
      resize: none;
      font-family: inherit;
      line-height: 1.4;
      max-height: 90px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    #chat-input:focus { border-color: #2563eb; }
    #chat-input::placeholder { color: #9ca3af; }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.12s;
    }
    #send-btn:hover:not(:disabled) { opacity: 0.88; transform: scale(1.06); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #send-btn svg { color: white; }

    /* Footer */
    #chat-footer {
      text-align: center;
      font-size: 10.5px;
      color: #9ca3af;
      padding: 6px 0 8px;
      flex-shrink: 0;
    }

    /* Mobile */
    @media (max-width: 420px) {
      #chat-window { right: 12px; left: 12px; width: auto; bottom: 82px; }
      #chat-bubble { bottom: 16px; right: 16px; }
    }
  </style>
</head>
<body>

<!-- ── Floating bubble ──────────────────────────────────────────────────────── -->
<button id="chat-bubble" aria-label="Open chat">
  <span id="notif-dot" title="We're online"></span>

  <!-- Chat icon -->
  <svg class="icon-chat" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
       viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>

  <!-- Close icon -->
  <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
       viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
</button>

<!-- ── Chat window ───────────────────────────────────────────────────────────── -->
<div id="chat-window" role="dialog" aria-label="Chat assistant">
  <div id="chat-header">
    <div class="avatar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
      </svg>
    </div>
    <div class="header-info">
      <h3>Website Assistant</h3>
      <p><span class="online-dot"></span>Online · Typically replies instantly</p>
    </div>
  </div>

  <div id="chat-messages" aria-live="polite"></div>

  <div id="chat-input-area">
    <textarea id="chat-input" placeholder="Type a message…" rows="1"
              aria-label="Chat message"></textarea>
    <button id="send-btn" aria-label="Send message" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"
           stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div id="chat-footer">Powered by AI · We reply instantly</div>
</div>

<script>
  // ── Config ─────────────────────────────────────────────────────────────────
  // When loaded in an iframe or on the same origin, API calls go to this site.
  // When embedded via <script> in another site, set WIDGET_API_BASE to the full
  // URL of the chat service (e.g. https://your-site.vercel.app or /chat if routed).
  const API_BASE = (typeof WIDGET_API_BASE !== "undefined")
    ? WIDGET_API_BASE
    : "/";

  // ── State ──────────────────────────────────────────────────────────────────
  let isOpen = false;
  let isTyping = false;
  let history = [];   // { role: "user"|"bot", content: string }[]

  // ── Elements ───────────────────────────────────────────────────────────────
  const bubble   = document.getElementById("chat-bubble");
  const window_  = document.getElementById("chat-window");
  const messages = document.getElementById("chat-messages");
  const input    = document.getElementById("chat-input");
  const sendBtn  = document.getElementById("send-btn");
  const notifDot = document.getElementById("notif-dot");

  // ── Helpers ────────────────────────────────────────────────────────────────
  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role === "user" ? "user" : "bot"}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "typing-indicator";
    el.id = "typing-indicator";
    el.innerHTML = "<span></span><span></span><span></span>";
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function setInputEnabled(enabled) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled || input.value.trim() === "";
  }

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 90) + "px";
    sendBtn.disabled = input.value.trim() === "" || isTyping;
  }

  // ── Toggle widget ──────────────────────────────────────────────────────────
  function toggleChat() {
    isOpen = !isOpen;
    bubble.classList.toggle("open", isOpen);
    window_.classList.toggle("open", isOpen);
    if (isOpen) {
      // Hide notification dot once opened
      notifDot.style.display = "none";
      // Show greeting if first open
      if (messages.children.length === 0) {
        setTimeout(() => {
          appendMessage("bot", "👋 Hi there! I'm your website assistant. I can help you with questions about this site, our services, or connect you with our team. How can I help?");
        }, 200);
      }
      input.focus();
    }
  }

  bubble.addEventListener("click", toggleChat);

  // ── Keyboard: Enter to send, Shift+Enter for newline ──────────────────────
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", autoResize);
  sendBtn.addEventListener("click", sendMessage);

  // Enable send button when there's text
  input.addEventListener("input", () => {
    sendBtn.disabled = input.value.trim() === "" || isTyping;
  });

  // ── Send message ───────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isTyping) return;

    isTyping = true;
    input.value = "";
    input.style.height = "auto";
    setInputEnabled(false);

    appendMessage("user", text);
    showTyping();

    // Build API-compatible history (last 4 messages)
    const apiHistory = history.slice(-4).map((m) => ({
      role: m.role === "user" ? "user" : "assistant",
      content: m.content,
    }));

    try {
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: apiHistory }),
      });

      const data = await res.json();
      hideTyping();

      if (data.error) {
        appendMessage("bot", "Sorry, something went wrong. Please try again.");
      } else {
        const reply = data.reply;
        appendMessage("bot", reply);
        // Update history
        history.push({ role: "user", content: text });
        history.push({ role: "bot", content: reply });
        // Keep trimmed
        if (history.length > 8) history = history.slice(-8);
      }
    } catch (err) {
      hideTyping();
      appendMessage("bot", "I'm having trouble connecting right now. Please try again in a moment.");
      console.error("Chat error:", err);
    }

    isTyping = false;
    setInputEnabled(true);
    input.focus();
  }
</script>
</body>
</html>
